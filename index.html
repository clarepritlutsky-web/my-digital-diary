<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Little Internet Corner</title>

    <link rel="stylesheet" href="style.css">
</head>

    <!-- SKETCHBOOK -->

<div class="sketchbook-overlay" id="sketchbook">

    <button class="sketchbook-close" id="sketchbook-close">
        ×
    </button>

    <div class="sketchbook">

        <div class="book-page left-page">

            <div class="page-content">

                <span class="page-number">01</span>

                <p class="handwritten">
                    little things
                </p>

                <svg class="sketch" viewBox="0 0 300 300">

                    <!-- sun -->
                    <circle
                        cx="150"
                        cy="90"
                        r="35"
                        fill="none"
                        stroke="#333"
                        stroke-width="3"
                    />

                    <!-- sun rays -->
                    <line x1="150" y1="40" x2="150" y2="20"
                        stroke="#333" stroke-width="3"/>

                    <line x1="150" y1="140" x2="150" y2="160"
                        stroke="#333" stroke-width="3"/>

                    <line x1="100" y1="90" x2="80" y2="90"
                        stroke="#333" stroke-width="3"/>

                    <line x1="200" y1="90" x2="220" y2="90"
                        stroke="#333" stroke-width="3"/>

                    <!-- little hills -->
                    <path
                        d="M40 230
                           Q100 170 150 220
                           Q210 150 270 230"
                        fill="none"
                        stroke="#333"
                        stroke-width="3"
                    />

                    <!-- flower -->
                    <circle cx="80" cy="210" r="8"
                        fill="none"
                        stroke="#333"
                        stroke-width="2"/>

                    <line x1="80" y1="218" x2="80" y2="250"
                        stroke="#333"
                        stroke-width="2"/>

                    <path
                        d="M80 235 Q65 225 58 235"
                        fill="none"
                        stroke="#333"
                        stroke-width="2"
                    />

                </svg>

                <p class="handwritten small">
                    somewhere I'd like to be ♡
                </p>

            </div>

        </div>


        <div class="book-page right-page">

            <div class="page-content">

                <span class="page-number">02</span>

                <p class="handwritten">
                    today's little sketch
                </p>

                <svg class="sketch" viewBox="0 0 300 300">

                    <!-- coffee cup -->
                    <path
                        d="M85 110
                           L215 110
                           L200 220
                           L100 220
                           Z"
                        fill="none"
                        stroke="#333"
                        stroke-width="3"
                    />

                    <!-- handle -->
                    <path
                        d="M215 140
                           Q260 130 245 175
                           Q235 195 205 185"
                        fill="none"
                        stroke="#333"
                        stroke-width="3"
                    />

                    <!-- coffee -->
                    <ellipse
                        cx="150"
                        cy="110"
                        rx="65"
                        ry="15"
                        fill="none"
                        stroke="#333"
                        stroke-width="3"
                    />

                    <!-- steam -->
                    <path
                        d="M125 80
                           Q110 60 125 40"
                        fill="none"
                        stroke="#333"
                        stroke-width="2"
                    />

                    <path
                        d="M150 80
                           Q135 60 150 35"
                        fill="none"
                        stroke="#333"
                        stroke-width="2"
                    />

                    <path
                        d="M175 80
                           Q160 60 175 40"
                        fill="none"
                        stroke="#333"
                        stroke-width="2"
                    />

                    <!-- little stars -->
                    <text x="50" y="80" font-size="25">✦</text>
                    <text x="225" y="80" font-size="20">✧</text>

                </svg>

                <p class="handwritten small">
                    slow morning
                </p>

            </div>

        </div>

    </div>


    <div class="sketchbook-controls">

        <button id="previous-page">
            ←
        </button>

        <span id="page-counter">
            1 / 2
        </span>

        <button id="next-page">
            →
        </button>

    </div>

</div>

        <section class="diary">
